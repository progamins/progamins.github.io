<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Demo del asistente IA: pregunta en lenguaje natural, respuesta con citas y productos recuperados">
  <defs>
    <radialGradient id="bg" cx="0.72" cy="0" r="1.1">
      <stop offset="0" stop-color="#1f1913"/>
      <stop offset="0.55" stop-color="#0d0b09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfa764"/>
      <stop offset="1" stop-color="#e7c98d"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211b13"/>
      <stop offset="1" stop-color="#191510"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#39322a" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#dots)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#gold)"/>

  <!-- Header -->
  <text x="72" y="88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#cfa764">RETRIEVAL-AUGMENTED GENERATION · DEMO EN VIVO</text>
  <text x="72" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#f2ebdc">Asistente de compras <tspan fill="#cfa764">IA</tspan></text>
  <text x="72" y="186" font-family="system-ui, Segoe UI, sans-serif" font-size="17" fill="#b5aa97">Búsqueda semántica sobre el catálogo real — embeddings + pgvector, respuestas con citas.</text>

  <!-- Question bubble -->
  <rect x="72" y="228" rx="16" width="1136" height="76" fill="url(#q)" stroke="#39322a"/>
  <circle cx="112" cy="266" r="16" fill="#262117"/>
  <text x="112" y="272" font-family="system-ui, sans-serif" font-size="16" fill="#cfa764" text-anchor="middle">?</text>
  <text x="148" y="273" font-family="system-ui, Segoe UI, sans-serif" font-size="21" fill="#f2ebdc">Regalo elegante de plata para un aniversario, que no sea caro</text>

