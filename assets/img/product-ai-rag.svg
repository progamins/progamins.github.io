  <text x="96" y="362" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3" fill="#8a8172">RESPUESTA · GEMINI-2.5-FLASH</text>
  <text x="96" y="398" font-family="system-ui, Segoe UI, sans-serif" font-size="20" fill="#f2ebdc">¡Claro! Te sugiero: <tspan fill="#e7c98d" font-weight="700">Collar Plata Minimalista [1]</tspan> — de plata 925 con líneas</text>

