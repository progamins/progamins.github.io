<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Mock de la API proceso-nodes: petición GET, respuesta JSON con datos de estudiante y badges de seguridad">
  <defs>
    <radialGradient id="bg2" cx="0.3" cy="0" r="1.15">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F1F5F9"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#CBD5E1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg2)"/>
  <rect width="1280" height="800" fill="url(#dots2)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#gold2)"/>

  <!-- Header -->
  <text x="72" y="88" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="4" fill="#2563EB">REST API · NODE · EXPRESS · MYSQL</text>
  <text x="72" y="148" font-family="Georgia, serif" font-size="44" fill="#0F172A">proceso-nodes <tspan font-style="italic" fill="#2563EB">— API</tspan></text>
  <text x="72" y="186" font-family="system-ui, sans-serif" font-size="17" fill="#55637A">Estudiantes, notas, horarios y justificaciones con QR — JWT + bcrypt, rate limiting y tests.</text>

  <!-- Request bar -->
  <rect x="72" y="228" rx="12" width="1136" height="62" fill="#0F172A"/>
  <rect x="94" y="247" rx="6" width="52" height="26" fill="#1F7A4D"/>
  <text x="120" y="265" font-family="ui-monospace, monospace" font-size="14" fill="#EAF7EF" text-anchor="middle">GET</text>
  <text x="166" y="266" font-family="ui-monospace, monospace" font-size="16" fill="#E7ECF5">/api/v1/estudiantes/1042</text>
  <text x="1140" y="266" font-family="ui-monospace, monospace" font-size="14" fill="#7BD8A8" text-anchor="end">200 OK · 42 ms</text>

  <!-- Response panel -->
  <rect x="72" y="316" rx="14" width="730" height="330" fill="#111827" stroke="#1E293B"/>
  <text x="100" y="356" font-family="ui-monospace, monospace" font-size="13" fill="#8A8172" letter-spacing="2">RESPONSE · APPLICATION/JSON</text>
  <text x="100" y="396" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">{</text>
  <text x="126" y="428" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"id":</text><text x="192" y="428" font-family="ui-monospace, monospace" font-size="16" fill="#9FC2E8">1042,</text>
  <text x="126" y="460" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"nombre":</text><text x="248" y="460" font-family="ui-monospace, monospace" font-size="16" fill="#9FD8AE">"Rosa Quispe Mamani",</text>
  <text x="126" y="492" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"programa":</text><text x="252" y="492" font-family="ui-monospace, monospace" font-size="16" fill="#9FD8AE">"Enfermería Técnica",</text>
  <text x="126" y="524" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"qr_asistencia":</text><text x="302" y="524" font-family="ui-monospace, monospace" font-size="16" fill="#9FD8AE">true,</text>
  <text x="126" y="556" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"promedio":</text><text x="244" y="556" font-family="ui-monospace, monospace" font-size="16" fill="#9FC2E8">16.4,</text>
  <text x="126" y="588" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">"horario":</text><text x="232" y="588" font-family="ui-monospace, monospace" font-size="16" fill="#9FD8AE">"Mañana — Turno A"</text>
  <text x="100" y="620" font-family="ui-monospace, monospace" font-size="16" fill="#3B82F6">}</text>

  <!-- Security badges column -->
  <rect x="836" y="316" rx="14" width="372" height="330" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="864" y="356" font-family="ui-monospace, monospace" font-size="13" fill="#8894A8" letter-spacing="2">SEGURIDAD INCLUIDA</text>
  <rect x="864" y="380" rx="8" width="316" height="44" fill="#F1F5F9"/>
  <circle cx="890" cy="402" r="9" fill="#1F7A4D"/><text x="886" y="407" font-family="system-ui" font-size="13" fill="#fff">✓</text>
  <text x="912" y="408" font-family="system-ui, sans-serif" font-size="15" fill="#0F172A">JWT + refresh tokens</text>
  <rect x="864" y="436" rx="8" width="316" height="44" fill="#F1F5F9"/>
  <circle cx="890" cy="458" r="9" fill="#1F7A4D"/><text x="886" y="463" font-family="system-ui" font-size="13" fill="#fff">✓</text>
  <text x="912" y="464" font-family="system-ui, sans-serif" font-size="15" fill="#0F172A">bcrypt — contraseñas hasheadas</text>
  <rect x="864" y="492" rx="8" width="316" height="44" fill="#F1F5F9"/>
  <circle cx="890" cy="514" r="9" fill="#1F7A4D"/><text x="886" y="519" font-family="system-ui" font-size="13" fill="#fff">✓</text>
  <text x="912" y="520" font-family="system-ui, sans-serif" font-size="15" fill="#0F172A">Rate limiting por IP</text>
  <rect x="864" y="548" rx="8" width="316" height="44" fill="#F1F5F9"/>
  <circle cx="890" cy="570" r="9" fill="#1F7A4D"/><text x="886" y="575" font-family="system-ui" font-size="13" fill="#fff">✓</text>
  <text x="912" y="576" font-family="system-ui, sans-serif" font-size="15" fill="#0F172A">Tests automatizados</text>
  <text x="864" y="628" font-family="ui-monospace, monospace" font-size="13" fill="#8894A8" letter-spacing="2">QR · UPLOADS · PERFIL</text>

  <!-- Footer pills -->
  <line x1="72" y1="706" x2="1208" y2="706" stroke="#E2E8F0"/>
  <rect x="72" y="726" rx="999" width="112" height="34" fill="none" stroke="#CBD5E1"/>
  <text x="128" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#55637A" text-anchor="middle">Node.js</text>
  <rect x="196" y="726" rx="999" width="118" height="34" fill="none" stroke="#CBD5E1"/>
  <text x="255" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#55637A" text-anchor="middle">Express</text>
  <rect x="326" y="726" rx="999" width="112" height="34" fill="none" stroke="#CBD5E1"/>
  <text x="382" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#55637A" text-anchor="middle">MySQL</text>
  <text x="1208" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#8894A8" text-anchor="end">github.com/progamins/proceso-nodes</text>
</svg>
