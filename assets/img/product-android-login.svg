<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Mockup del login Android: formulario de acceso, base de datos SQL Server con TLS">
  <defs>
    <radialGradient id="bg3" cx="0.7" cy="0" r="1.15">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="0.6" stop-color="#F2EDE4"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7B2D"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#B8AE9C" opacity="0.3"/>
    </pattern>
    <linearGradient id="phonebody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2A25"/>
      <stop offset="1" stop-color="#1B1A17"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg3)"/>
  <rect width="1280" height="800" fill="url(#dots3)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#gold3)"/>

  <!-- Header -->
  <text x="72" y="88" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="4" fill="#9A7B2D">ANDROID · JAVA · SQL SERVER</text>
  <text x="72" y="148" font-family="Georgia, serif" font-size="44" fill="#1B1A17">login <tspan font-style="italic" fill="#9A7B2D">— app móvil</tspan></text>
  <text x="72" y="186" font-family="system-ui, sans-serif" font-size="17" fill="#6E675C">Autenticación en Java con conexión TLS a SQL Server — consultas parametrizadas y validación de entrada.</text>

  <!-- Phone mockup -->
  <rect x="150" y="230" rx="44" width="330" height="560" fill="url(#phonebody)" stroke="#0B0A08" stroke-width="3"/>
  <rect x="164" y="246" rx="32" width="302" height="528" fill="#FAF7F2"/>
  <rect x="272" y="256" rx="10" width="86" height="18" fill="#0B0A08"/>
  <text x="315" y="316" font-family="Georgia, serif" font-size="30" fill="#1B1A17" text-anchor="middle">Login</text>
  <rect x="204" y="330" width="222" height="2" fill="url(#gold3)"/>
  <text x="204" y="384" font-family="system-ui, sans-serif" font-size="13" fill="#6E675C">Usuario</text>
  <rect x="204" y="394" rx="10" width="222" height="46" fill="#FFFFFF" stroke="#DDD5C6"/>
  <circle cx="228" cy="417" r="9" fill="none" stroke="#9A7B2D" stroke-width="2"/>
  <circle cx="228" cy="413" r="3.5" fill="#9A7B2D"/>
  <path d="M 220 425 q 8 -8 16 0" fill="none" stroke="#9A7B2D" stroke-width="2"/>
  <text x="248" y="423" font-family="system-ui, sans-serif" font-size="13" fill="#9A927F">nombre.usuario</text>
  <text x="204" y="474" font-family="system-ui, sans-serif" font-size="13" fill="#6E675C">Contraseña</text>
  <rect x="204" y="484" rx="10" width="222" height="46" fill="#FFFFFF" stroke="#DDD5C6"/>
  <circle cx="224" cy="507" r="4" fill="#9A7B2D"/><circle cx="235" cy="507" r="4" fill="#9A7B2D"/><circle cx="246" cy="507" r="4" fill="#9A7B2D"/>
  <circle cx="224" cy="518" r="4" fill="#9A7B2D"/><circle cx="235" cy="518" r="4" fill="#9A7B2D"/><circle cx="246" cy="518" r="4" fill="#9A7B2D"/>
  <rect x="258" y="505" width="44" height="16" rx="8" fill="none" stroke="#9A7B2D" stroke-width="2"/>
  <circle cx="296" cy="513" r="7" fill="#9A7B2D"/>
  <rect x="204" y="548" rx="10" width="222" height="48" fill="#1B1A17"/>
  <text x="315" y="578" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" text-anchor="middle">Ingresar</text>
  <text x="315" y="628" font-family="system-ui, sans-serif" font-size="13" fill="#6E675C" text-anchor="middle">¿No tienes cuenta? <tspan fill="#9A7B2D" font-weight="600">Regístrate</tspan></text>
  <text x="315" y="662" font-family="ui-monospace, monospace" font-size="10" fill="#9A927F" text-anchor="middle">TLS · PreparedStatement</text>

  <!-- SQL Server side -->
  <rect x="560" y="286" rx="16" width="560" height="420" fill="#FFFFFF" stroke="#DDD5C6"/>
  <text x="590" y="330" font-family="ui-monospace, monospace" font-size="13" fill="#9A927F" letter-spacing="2">ARQUITECTURA DE CONEXIÓN</text>

  <!-- phone icon label -->
  <rect x="590" y="356" rx="10" width="200" height="46" fill="#F2EDE4"/>
  <text x="690" y="385" font-family="system-ui, sans-serif" font-size="14" fill="#1B1A17" text-anchor="middle">App Android (Java)</text>

  <!-- arrows + TLS -->
  <line x1="790" y1="379" x2="856" y2="379" stroke="#C9A24B" stroke-width="2"/>
  <rect x="856" y="356" rx="10" width="220" height="46" fill="#F2EDE4"/>
  <rect x="876" y="366" rx="4" width="26" height="20" fill="none" stroke="#9A7B2D" stroke-width="2.5"/>
  <path d="M 881 366 v -6 a 8 8 0 0 1 16 0 v 6" fill="none" stroke="#9A7B2D" stroke-width="2.5"/>
  <text x="916" y="385" font-family="system-ui, sans-serif" font-size="14" fill="#1B1A17">TLS · ssl=require</text>

  <!-- DB cylinder -->
  <ellipse cx="700" cy="470" rx="78" ry="22" fill="#F2EDE4" stroke="#9A7B2D" stroke-width="2.5"/>
  <rect x="622" y="470" width="156" height="82" fill="#F2EDE4"/>
  <line x1="622" y1="470" x2="622" y2="552" stroke="#9A7B2D" stroke-width="2.5"/>
  <line x1="778" y1="470" x2="778" y2="552" stroke="#9A7B2D" stroke-width="2.5"/>
  <ellipse cx="700" cy="552" rx="78" ry="22" fill="#F2EDE4" stroke="#9A7B2D" stroke-width="2.5"/>
  <text x="700" y="518" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#1B1A17" text-anchor="middle">SQL Server</text>
  <text x="700" y="540" font-family="ui-monospace, monospace" font-size="12" fill="#9A927F" text-anchor="middle">Usuarios · Login</text>

  <!-- PreparedStatement card -->
  <rect x="884" y="440" rx="10" width="210" height="96" fill="#161512"/>
  <text x="902" y="470" font-family="ui-monospace, monospace" font-size="12" fill="#C9A24B">PreparedStatement</text>
  <text x="902" y="494" font-family="ui-monospace, monospace" font-size="12" fill="#E7ECF5">WHERE Usuario = ?</text>
  <text x="902" y="516" font-family="ui-monospace, monospace" font-size="12" fill="#E7ECF5">AND Clave = ?</text>
  <text x="902" y="516" font-family="ui-monospace, monospace" font-size="12" fill="#E7ECF5"></text>

  <!-- hardening note -->
  <rect x="590" y="586" rx="10" width="500" height="76" fill="#F2EDE4"/>
  <circle cx="618" cy="624" r="11" fill="#1F7A4D"/><text x="613" y="629" font-family="system-ui" font-size="14" fill="#fff">✓</text>
  <text x="644" y="618" font-family="system-ui, sans-serif" font-size="14" fill="#1B1A17">Hardening aplicado: consultas parametrizadas, TLS,</text>
  <text x="644" y="640" font-family="system-ui, sans-serif" font-size="14" fill="#1B1A17">validación de entrada, ofuscación release y historial purgado.</text>

  <!-- Footer pills -->
  <line x1="72" y1="706" x2="1208" y2="706" stroke="#DDD5C6"/>
  <rect x="72" y="726" rx="999" width="90" height="34" fill="none" stroke="#C9BFA8"/>
  <text x="117" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#6E675C" text-anchor="middle">Java</text>
  <rect x="174" y="726" rx="999" width="122" height="34" fill="none" stroke="#C9BFA8"/>
  <text x="235" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#6E675C" text-anchor="middle">Android</text>
  <rect x="308" y="726" rx="999" width="140" height="34" fill="none" stroke="#C9BFA8"/>
  <text x="378" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#6E675C" text-anchor="middle">SQL Server</text>
  <rect x="460" y="726" rx="999" width="90" height="34" fill="none" stroke="#C9BFA8"/>
  <text x="505" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#6E675C" text-anchor="middle">jTDS</text>
  <text x="1208" y="748" font-family="ui-monospace, monospace" font-size="13" fill="#9A927F" text-anchor="end">github.com/progamins/android-login-sqlserver</text>
</svg>
