<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0a0d">
  <title>404 — Page not found · Progamins</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0A0A0D; --panel:#14141A; --line:rgba(255,255,255,0.08);
      --text:#F4F4F5; --muted:#A1A1AA; --dim:#71717A;
      --cyan:#22d3ee; --violet:#8b5cf6;
      --font-display:"Syne",system-ui,sans-serif;
      --font-body:"Inter",system-ui,-apple-system,sans-serif;
      --font-mono:ui-monospace,"JetBrains Mono",monospace;
    }
    @media(prefers-color-scheme: light){
      :root{ --bg:#FCFCF9; --panel:#FFFFFF; --line:rgba(0,0,0,0.07); --text:#0A0A0D; --muted:#71717A; --dim:#A1A1AA; }
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;
      min-height:100svh;display:grid;place-items:center;-webkit-font-smoothing:antialiased;padding:24px}
    main{max-width:560px;width:100%;text-align:center}
    .code{font-family:var(--font-display);font-weight:800;font-size:clamp(72px,14vw,120px);
      line-height:1;letter-spacing:-0.04em;
      background:linear-gradient(120deg,var(--cyan),var(--violet));
      -webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-family:var(--font-display);font-size:clamp(20px,4vw,28px);margin-top:16px;letter-spacing:-0.01em}
    p{color:var(--muted);margin-top:12px;font-size:1rem}
    p small{display:block;color:var(--dim);font-size:.85rem;margin-top:4px}
    .btn{display:inline-block;margin-top:32px;padding:12px 24px;border-radius:999px;
      border:1px solid var(--line);background:var(--panel);color:var(--text);
      font-family:var(--font-mono);font-size:.85rem;text-decoration:none;
      transition:transform .2s cubic-bezier(0.16,1,0.30,1),border-color .2s}
    .btn:hover{transform:translateY(-2px);border-color:var(--cyan)}
    .btn + .btn{margin-left:12px}
    .foot{margin-top:48px;font-family:var(--font-mono);font-size:.72rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for doesn't exist or was moved.
      <small>La página que buscas no existe o fue movida.</small>
    </p>
    <a class="btn" href="/">← Back to portfolio / Volver al portafolio</a>
    <a class="btn" href="/es/">Español →</a>
    <div class="foot">Progamins · Build. Experiment. Ship.</div>
  </main>
</body>
</html>
